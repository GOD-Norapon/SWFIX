<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมออนไลน์ (Sw fix)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; }
        .tab-inactive:hover { color: #0f172a; border-bottom: 2px solid #cbd5e1; }
        
        /* Mobile Table Styling */
        @media (max-width: 768px) {
            .mobile-table thead { display: none; }
            .mobile-table tr { display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 0.75rem; margin-bottom: 1rem; padding: 1rem; background: white; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
            .mobile-table td { display: flex; justify-content: space-between; align-items: center; border: none; padding: 0.5rem 0; }
            .mobile-table td::before { content: attr(data-label); font-weight: 600; color: #64748b; font-size: 0.875rem; }
            .mobile-table td:not(:last-child) { border-bottom: 1px dashed #e2e8f0; }
        }

        /* Toast Animation */
        #toast { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-enter { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-leave { transform: translateX(-50%) translateY(1rem); opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header & Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary-600 text-white rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30">
                        <i class="ph ph-wrench text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">ระบบแจ้งซ่อม</h1>
                        <p class="text-xs text-slate-500">SW FIX</p>
                    </div>
                </div>
            </div>
            
            <!-- Tabs -->
            <nav class="flex space-x-6 overflow-x-auto no-scrollbar" aria-label="Tabs">
                <button onclick="switchTab('form')" id="tab-form" class="tab-active whitespace-nowrap py-3 px-1 text-sm flex items-center gap-2 transition-colors">
                    <i class="ph ph-plus-circle text-lg"></i> แจ้งซ่อมใหม่
                </button>
                <button onclick="switchTab('list')" id="tab-list" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm flex items-center gap-2 transition-colors">
                    <i class="ph ph-list-dashes text-lg"></i> รายการแจ้งซ่อม
                </button>
                <button onclick="switchTab('stats')" id="tab-stats" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm flex items-center gap-2 transition-colors">
                    <i class="ph ph-chart-pie-slice text-lg"></i> สถิติการซ่อม
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- ================= VIEW 1: FORM ================= -->
        <section id="view-form" class="block animate-fade-in">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-100">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph ph-note-pencil text-primary-600"></i> แบบฟอร์มแจ้งซ่อม
                    </h2>
                </div>
                <div class="p-6">
                    <form id="repairForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2 space-y-1">
                            <label for="name" class="block text-sm font-medium text-slate-700">ชื่อ-นามสกุลผู้แจ้ง <span class="text-red-500">*</span></label>
                            <input type="text" id="name" required placeholder="เช่น สมชาย ใจดี" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all">
                        </div>
                        <div class="md:col-span-2 space-y-1">
                            <label for="item" class="block text-sm font-medium text-slate-700">รายการที่ต้องการแจ้งซ่อม <span class="text-red-500">*</span></label>
                            <input type="text" id="item" required placeholder="เช่น คอมพิวเตอร์เปิดไม่ติด, แอร์ไม่เย็น" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all">
                        </div>
                        <div class="space-y-1">
                            <label for="building" class="block text-sm font-medium text-slate-700">อาคาร/สถานที่ <span class="text-red-500">*</span></label>
                            <input type="text" id="building" required placeholder="เช่น อาคาร A" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all">
                        </div>
                        <div class="space-y-1">
                            <label for="room" class="block text-sm font-medium text-slate-700">ห้อง <span class="text-red-500">*</span></label>
                            <input type="text" id="room" required placeholder="เช่น 101" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all">
                        </div>
                        
                        <div class="md:col-span-2 pt-4">
                            <button type="submit" id="submitBtn" class="w-full md:w-auto px-8 py-3 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-xl shadow-lg shadow-primary-500/30 transition-all flex items-center justify-center gap-2">
                                <i class="ph ph-paper-plane-right text-lg"></i> ส่งข้อมูลแจ้งซ่อม
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- ================= VIEW 2: LIST ================= -->
        <section id="view-list" class="hidden animate-fade-in">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph ph-list-magnifying-glass text-primary-600"></i> ประวัติการแจ้งซ่อม
                    </h2>
                    <button onclick="loadListData()" class="text-slate-500 hover:text-primary-600 transition-colors" title="รีเฟรช">
                        <i class="ph ph-arrows-clockwise text-xl"></i>
                    </button>
                </div>
                
                <div class="p-4 md:p-0 flex-1 overflow-x-auto">
                    <table class="w-full text-sm text-left mobile-table min-w-[800px]" id="repairTable">
                        <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4 font-semibold w-32">วันที่แจ้ง</th>
                                <th class="px-6 py-4 font-semibold w-16 text-center">ลำดับ</th>
                                <th class="px-6 py-4 font-semibold">ชื่อผู้แจ้ง</th>
                                <th class="px-6 py-4 font-semibold">รายการ</th>
                                <th class="px-6 py-4 font-semibold">สถานที่</th>
                                <th class="px-6 py-4 font-semibold w-32">สถานะ</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100">
                            <!-- Data will be injected here -->
                            <tr><td colspan="6" class="text-center py-10 text-slate-500">กำลังโหลดข้อมูล...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="bg-slate-50 px-6 py-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <span id="pageInfo" class="text-sm text-slate-500">หน้าที่ 1</span>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="prevBtn" onclick="changePage(-1)" disabled class="flex-1 sm:flex-none px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            ก่อนหน้า
                        </button>
                        <button id="nextBtn" onclick="changePage(1)" disabled class="flex-1 sm:flex-none px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                            ถัดไป
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= VIEW 3: STATS ================= -->
        <section id="view-stats" class="hidden animate-fade-in">
            <!-- Stats Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-2">
                        <i class="ph ph-clipboard-text text-2xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">แจ้งซ่อมทั้งหมด</p>
                    <p class="text-2xl font-bold text-slate-800" id="stat-total">-</p>
                </div>
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-2">
                        <i class="ph ph-clock text-2xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">รอตรวจสอบ</p>
                    <p class="text-2xl font-bold text-slate-800" id="stat-pending">-</p>
                </div>
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-2">
                        <i class="ph ph-check-circle text-2xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">ซ่อมเสร็จแล้ว</p>
                    <p class="text-2xl font-bold text-slate-800" id="stat-completed">-</p>
                </div>
                <div class="bg-white rounded-2xl p-5 border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
                    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-2">
                        <i class="ph ph-x-circle text-2xl"></i>
                    </div>
                    <p class="text-sm text-slate-500 font-medium">ซ่อมไม่ได้</p>
                    <p class="text-2xl font-bold text-slate-800" id="stat-failed">-</p>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 flex justify-center">
                <div class="w-full max-w-md">
                    <h3 class="text-center font-medium text-slate-700 mb-6">สัดส่วนสถานะการซ่อม</h3>
                    <div class="relative h-64 w-full">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-leave fixed bottom-6 left-1/2 z-50 flex items-center gap-3 px-4 py-3 bg-emerald-600 text-white rounded-xl shadow-lg">
        <i class="ph ph-check-circle text-xl" id="toast-icon"></i>
        <span id="toast-msg" class="text-sm font-medium">ข้อความแจ้งเตือน</span>
    </div>

    <!-- Scripts -->
    <script>
        // ==========================================
        // ⚠️ นำ URL ของ Web App ที่ได้จาก Google Apps Script มาใส่ที่นี่ ⚠️
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyOzEBDxJuSY0p9Z5vGBqdTSIGwruWP_oNmqH1Fy78VUBmySaslzPQ7KUfNSugeOEg8/exec'; 

        // State Variables
        let currentPage = 1;
        let isSubmitting = false;
        let chartInstance = null;

        // View Management
        function switchTab(viewId) {
            // Hide all views
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-stats').classList.add('hidden');
            
            // Show target view
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            
            // Reset Tabs UI
            ['form', 'list', 'stats'].forEach(id => {
                const tab = document.getElementById(`tab-${id}`);
                tab.classList.remove('tab-active');
                tab.classList.add('tab-inactive');
            });
            
            // Set Active Tab UI
            const activeTab = document.getElementById(`tab-${viewId}`);
            activeTab.classList.remove('tab-inactive');
            activeTab.classList.add('tab-active');

            // Trigger data loading based on view
            if (viewId === 'list') loadListData();
            if (viewId === 'stats') loadStatsData();
        }

        // UUID Generator for Idempotency
        function makeUUIDv4() {
            if (crypto?.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');
            
            msg.textContent = message;
            
            if (type === 'error') {
                toast.classList.replace('bg-emerald-600', 'bg-red-600');
                icon.className = 'ph ph-x-circle text-xl';
            } else {
                toast.classList.replace('bg-red-600', 'bg-emerald-600');
                icon.className = 'ph ph-check-circle text-xl';
            }

            toast.classList.remove('toast-leave');
            toast.classList.add('toast-enter');

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
            }, 3000);
        }

        // Form Submit
        document.getElementById('repairForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting) return;

            // ตรวจสอบว่าใส่ URL หรือยัง
            if (SCRIPT_URL.includes('YOUR_URL_HERE')) {
                showToast('กรุณาแก้ไข SCRIPT_URL ในโค้ดก่อนใช้งาน', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            const payload = {
                name: document.getElementById('name').value,
                item: document.getElementById('item').value,
                building: document.getElementById('building').value,
                room: document.getElementById('room').value,
                idempotencyKey: makeUUIDv4()
            };

            isSubmitting = true;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> กำลังบันทึก...';
            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // ใช้ text/plain ในการ POST ไปยัง GAS เพื่อหลีกเลี่ยงปัญหา CORS Preflight
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    }
                });
                
                const result = await response.json();
                
                if (result.created !== false) {
                    showToast(result.message || 'บันทึกข้อมูลสำเร็จ');
                    document.getElementById('repairForm').reset();
                    // เปลี่ยนไปหน้ารายการ
                    setTimeout(() => switchTab('list'), 1000);
                } else {
                    showToast(result.message, 'error');
                }
            } catch (error) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
                console.error(error);
            } finally {
                isSubmitting = false;
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        });

        // Load List Data
        async function loadListData(page = currentPage) {
            if (SCRIPT_URL.includes('YOUR_URL_HERE')) return;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-slate-500"><i class="ph ph-spinner animate-spin text-2xl mx-auto mb-2"></i>กำลังโหลดข้อมูล...</td></tr>';
            
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getList&page=${page}`);
                const res = await response.json();
                
                currentPage = res.currentPage;
                
                document.getElementById('pageInfo').textContent = `หน้าที่ ${res.currentPage} จาก ${res.totalPages}`;
                document.getElementById('prevBtn').disabled = !res.hasPreviousPage;
                document.getElementById('nextBtn').disabled = !res.hasNextPage;

                renderTable(res.data);
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-red-500">ไม่สามารถดึงข้อมูลได้ โปรดลองอีกครั้ง</td></tr>';
            }
        }

        function changePage(delta) {
            loadListData(currentPage + delta);
        }

        function getStatusBadge(status) {
            const s = String(status || '').trim();
            if (s === 'รอตรวจสอบ' || s === '') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800"><span class="w-1.5 h-1.5 bg-amber-500 rounded-full mr-1.5"></span>รอตรวจสอบ</span>`;
            if (s === 'ซ่อมแล้ว') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5"></span>ซ่อมแล้ว</span>`;
            if (s === 'ซ่อมไม่ได้') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800"><span class="w-1.5 h-1.5 bg-red-500 rounded-full mr-1.5"></span>ซ่อมไม่ได้</span>`;
            if (s === 'รออะไหล่') return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full mr-1.5"></span>รออะไหล่</span>`;
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-800">${s}</span>`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-10 text-slate-500">ยังไม่มีข้อมูลแจ้งซ่อม</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(row => `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td data-label="วันที่แจ้ง" class="px-6 py-4 text-slate-500">${row[0] || '-'}</td>
                    <td data-label="ลำดับ" class="px-6 py-4 text-center font-medium text-slate-900 md:text-slate-500">${row[1] || '-'}</td>
                    <td data-label="ชื่อผู้แจ้ง" class="px-6 py-4 font-medium text-slate-900">${row[2] || '-'}</td>
                    <td data-label="รายการ" class="px-6 py-4 text-slate-600">${row[3] || '-'}</td>
                    <td data-label="สถานที่" class="px-6 py-4 text-slate-600">${row[4] || '-'} / ห้อง ${row[5] || '-'}</td>
                    <td data-label="สถานะ" class="px-6 py-4">${getStatusBadge(row[6])}</td>
                </tr>
            `).join('');
        }

        // Load Stats Data
        async function loadStatsData() {
            if (SCRIPT_URL.includes('YOUR_URL_HERE')) return;
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getStats`);
                const stats = await response.json();
                
                document.getElementById('stat-total').textContent = stats.total;
                document.getElementById('stat-pending').textContent = stats.pending;
                document.getElementById('stat-completed').textContent = stats.completed;
                document.getElementById('stat-failed').textContent = stats.failed;

                renderChart(stats);
            } catch (error) {
                console.error("Error loading stats", error);
            }
        }

        function renderChart(stats) {
            const ctx = document.getElementById('statusChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            const dataValues = [stats.pending, stats.completed, stats.failed, stats.waiting];
            // ตรวจสอบว่ามีข้อมูลหรือไม่
            const hasData = dataValues.some(val => val > 0);

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['รอตรวจสอบ', 'ซ่อมเสร็จแล้ว', 'ซ่อมไม่ได้', 'รออะไหล่'],
                    datasets: [{
                        data: hasData ? dataValues : [1],
                        backgroundColor: hasData 
                            ? ['#fbbf24', '#34d399', '#f87171', '#60a5fa'] 
                            : ['#f1f5f9'], // สีเทาถ้าไม่มีข้อมูล
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
